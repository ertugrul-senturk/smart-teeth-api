[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-teeth-api"
version = "0.1.0"
description = "Smart Teeth API"
authors = [
    {name = "Author"}
]
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.5.0",
    "pymongo>=4.6.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "cryptography>=46.0.4",
    "gunicorn>=22.0.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]